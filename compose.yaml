services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hvac}
      POSTGRES_USER: ${POSTGRES_USER:-hvac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hvac}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hvac}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-hvac}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hvac}
      HONO_SERVICE_TOKEN: ${HONO_SERVICE_TOKEN:?Set HONO_SERVICE_TOKEN in .env}
      PORT: "3001"
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hvac}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hvac}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-hvac}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hvac}
      HONO_INTERNAL_URL: http://server:3001
      HONO_SERVICE_TOKEN: ${HONO_SERVICE_TOKEN:?Set HONO_SERVICE_TOKEN in .env}
      SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  tools:
    profiles:
      - tools
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hvac}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hvac}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-hvac}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hvac}
      HONO_INTERNAL_URL: http://server:3001
      HONO_SERVICE_TOKEN: ${HONO_SERVICE_TOKEN:?Set HONO_SERVICE_TOKEN in .env}
      SITE_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["pnpm"]

volumes:
  postgres-data:
