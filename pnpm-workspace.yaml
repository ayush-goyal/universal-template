packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  # Dev tooling
  dotenv-cli: ^11.0.0
  oxlint: 1.76.0
  oxlint-tsgolint: 7.0.2001
  prettier: ^3.8.1
  typescript: ^7.0.2
  "@types/node": ^22.13.11

  # Misc
  zod: ^4
  superjson: ^2.2.2
  # One date library for the whole repo, web and native alike.
  luxon: ^3.7.2
  "@types/luxon": ^3.7.3

  # Tanstack & tRPC
  "@tanstack/react-query": ^5.90.12
  "@trpc/client": ^11.17.0
  "@trpc/tanstack-react-query": ^11.17.0
  "@trpc/server": ^11.17.0

  # React
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": ~19.2.2
  "@types/react-dom": ~19.1.7

  # Auth
  # Keep these three in lockstep: @better-auth/stripe declares a `better-auth` peer on its own
  # minor, so a lagging core version resolves to an unmet peer dependency.
  better-auth: ^1.6.25
  "@better-auth/expo": ^1.6.25
  "@better-auth/stripe": ^1.6.25

  # Billing
  stripe: ^22.4.0

catalogs:
  expo:
    typescript: ~6.0.3
