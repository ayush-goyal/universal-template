# Codex project configuration. Loaded only in a trusted project — run `codex` here once and
# accept the trust prompt, otherwise this whole file is ignored.
#
# The MCP server list below is a hand-maintained duplicate of `.cursor/mcp.json`. Adding,
# renaming, or removing a server means editing both files. See `.agents/README.md`.
#
# Codex does not interpolate `${VAR}` placeholders. A server that needs a credential either
# names the variable (`env_vars` for stdio, `bearer_token_env_var` for HTTP) and inherits it
# from the shell Codex was launched in, or authenticates over OAuth via `codex mcp login <name>`.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.expo]
url = "https://mcp.expo.dev/mcp"

# `pnpm dlx` downloads the package on first use, which can exceed the default startup timeout.
[mcp_servers.shadcn]
command = "pnpm"
args = ["dlx", "shadcn@latest", "mcp"]
startup_timeout_sec = 60

[mcp_servers.playwright]
command = "pnpm"
args = ["dlx", "@playwright/mcp@latest"]
startup_timeout_sec = 60

# `mcp` is a required subcommand as of v2. Only the `simulator` workflow loads by default, which is
# 24 tools instead of 77; opt into others (`device`, `ui-automation`, `debugging`, ...) with
# XCODEBUILDMCP_ENABLED_WORKFLOWS. A clean build outlasts the default 60s tool timeout. Xcode is
# required, so set `enabled = false` on Linux and in cloud agents. If a `.xcodebuildmcp/config.yaml`
# is ever added it outranks both env vars below, and it resolves against the launch directory only.
[mcp_servers.XcodeBuildMCP]
command = "pnpm"
args = ["dlx", "xcodebuildmcp@latest", "mcp"]
env = { XCODEBUILDMCP_SENTRY_DISABLED = "true" }
startup_timeout_sec = 60
tool_timeout_sec = 600
